[workspace]
members = ["bin", "helpers", "clock", "alarm", "slint-program", "timer", "stopwatch"]
resolver = "3"

[workspace.dependencies]
slint = { version = "1.18.1", features = ["renderer-skia", "backend-winit"] }
slint-interpreter = "1.18.1"
slint-build = "1.18.1"
i-slint-backend-testing = "1.18.1"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 2
debug = true

[profile.release]
opt-level = 2
